# ============================================
# Stage 1: Build React/Vite application
# ============================================
FROM node:20-alpine AS builder

WORKDIR /app

# Install dependencies
# COPY package.json package-lock.json ./
# RUN npm ci

COPY package.json ./
RUN npm install

# Copy application source
COPY . .

# API URL available during Vite build
ARG VITE_API_BASE_URL=http://187.127.163.17:3035
ENV VITE_API_BASE_URL=${VITE_API_BASE_URL}

# Build production application
RUN npm run build


# ============================================
# Stage 2: Production Nginx server
# ============================================
FROM nginx:alpine AS runner

# Remove default Nginx content/config
RUN rm -rf /usr/share/nginx/html/*
RUN rm -f /etc/nginx/conf.d/default.conf

# Copy custom Nginx configuration
COPY nginx.conf /etc/nginx/conf.d/default.conf

# Copy Vite production build
COPY --from=builder /app/dist /usr/share/nginx/html

EXPOSE 80

HEALTHCHECK --interval=30s --timeout=5s --start-period=5s --retries=3 \
  CMD wget --quiet --tries=1 --spider http://localhost:80/healthz || exit 1

CMD ["nginx", "-g", "daemon off;"]
server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 100M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;

    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/xml
        application/javascript
        application/json;

    # React/Vite build directory
    root /usr/share/nginx/html;
    index index.html;

    # Static assets caching
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # React SPA routing
    location / {
        try_files $uri $uri/ /index.html;

        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
    }

    # Docker / deployment health check
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }
}